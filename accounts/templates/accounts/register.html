<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Task</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f8faff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .register-box {
        width: 100%;
        max-width: 390px;
        background: #ffffff;
        padding: 36px;
        border: 1px solid #e5eaf3;
        border-radius: 14px;
        box-shadow: 0 10px 35px rgba(30, 64, 175, 0.08);
      }

      .logo {
        text-align: center;
        color: #2563eb;
        font-size: 27px;
        font-weight: 700;
        margin-bottom: 28px;
      }

      h2 {
        color: #172554;
        text-align: center;
        font-size: 25px;
        margin-bottom: 9px;
      }

      .subtitle {
        color: #64748b;
        text-align: center;
        font-size: 14px;
        margin-bottom: 28px;
      }

      label {
        display: block;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 12px 13px;
        margin-bottom: 20px;
        border: 1px solid #dbe2ed;
        border-radius: 7px;
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .btn {
        display: block;
        width: 100%;
        padding: 13px;
        border-radius: 7px;
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .btn-primary {
        background: #2563eb;
        color: white;
        border: 1px solid #2563eb;
      }

      .btn-primary:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
      }

      .btn-secondary {
        margin-top: 12px;
        background: white;
        color: #2563eb;
        border: 1px solid #2563eb;
      }

      .btn-secondary:hover {
        background: #eff6ff;
      }

      .message {
        padding: 10px;
        margin-bottom: 16px;
        border-radius: 6px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 13px;
        text-align: center;
      }

      .home-link {
        display: block;
        text-align: center;
        margin-top: 22px;
        color: #64748b;
        text-decoration: none;
        font-size: 13px;
      }

      .home-link:hover {
        color: #2563eb;
      }

      @media (max-width: 420px) {
        .register-box {
          padding: 27px 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="register-box">
      <div class="logo">✓ Task</div>

      <h2>Create Account</h2>
      <p class="subtitle">Sign up to start managing your tasks</p>

      {% if messages %} {% for message in messages %}
      <p class="message">{{ message }}</p>
      {% endfor %} {% endif %}

      <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Choose a username"
          autocomplete="username"
          required
        />

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          required
        />

        <button type="submit" class="btn btn-primary">Create Account</button>

        <a href="{% url 'login' %}" class="btn btn-secondary">
          Already have an account? Login
        </a>
      </form>

      <a href="{% url 'home' %}" class="home-link"> ← Back to Home </a>
    </div>
  </body>
</html>
