<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Task</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f8faff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .login-box {
        width: 100%;
        max-width: 390px;
        background: #ffffff;
        padding: 36px;
        border: 1px solid #e5eaf3;
        border-radius: 14px;
        box-shadow: 0 10px 35px rgba(30, 64, 175, 0.08);
      }

      .logo {
        text-align: center;
        color: #2563eb;
        font-size: 27px;
        font-weight: 700;
        margin-bottom: 28px;
      }

      h2 {
        color: #172554;
        text-align: center;
        font-size: 25px;
        margin-bottom: 9px;
      }

      .subtitle {
        color: #64748b;
        text-align: center;
        font-size: 14px;
        margin-bottom: 28px;
      }

      label {
        display: block;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 12px 13px;
        margin-bottom: 20px;
        border: 1px solid #dbe2ed;
        border-radius: 7px;
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      button {
        width: 100%;
        padding: 13px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #1d4ed8;
      }

      .message {
        padding: 10px;
        margin-bottom: 16px;
        border-radius: 6px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 13px;
        text-align: center;
      }

      .register-link {
        text-align: center;
        margin-top: 24px;
        color: #64748b;
        font-size: 14px;
      }

      .register-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }

      .register-link a:hover {
        text-decoration: underline;
      }

      .home-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #64748b;
        text-decoration: none;
        font-size: 13px;
      }

      .home-link:hover {
        color: #2563eb;
      }

      @media (max-width: 420px) {
        .login-box {
          padding: 27px 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <div class="logo">✓ Task</div>

      <h2>Welcome back</h2>
      <p class="subtitle">Login to continue to your account</p>

      {% if messages %} {% for message in messages %}
      <p class="message">{{ message }}</p>
      {% endfor %} {% endif %}

      <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />

        <button type="submit">Login to Account</button>
      </form>

      <p class="register-link">
        Don't have an account?
        <a href="{% url 'register' %}">Create account</a>
      </p>
    </div>
  </body>
</html>
